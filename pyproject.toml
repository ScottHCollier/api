[project]
name = "api"
version = "0.1.0"
description = "Final Third club API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18,<2",
    "boto3>=1.42,<2",
    "fastapi>=0.128,<1",
    "pillow>=12,<13",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy>=2.0,<3",
    "python-multipart>=0.0.22,<1",
    "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
api-seed = "api.seed:main"

[dependency-groups]
dev = ["httpx2>=2.12,<3", "pytest>=9,<10", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
