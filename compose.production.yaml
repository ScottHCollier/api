services:
  object-storage:
    profiles: ["local-only"]
    restart: unless-stopped
    ports: []

  object-storage-init:
    profiles: ["local-only"]
    restart: "no"

  db:
    restart: unless-stopped
    ports: []

  api:
    command: ["sh", "scripts/start_production.sh"]
    restart: unless-stopped
    ports: []
    volumes: []
    environment:
      SEED_ON_STARTUP: "false"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      CLUB_BASE_DOMAIN: ${CLUB_BASE_DOMAIN:?Set CLUB_BASE_DOMAIN}
      CORS_ORIGINS: '${CORS_ORIGINS:?Set CORS_ORIGINS}'
      FA_IMPORT_ENABLED: ${FA_IMPORT_ENABLED:-true}
      FA_IMPORT_INTERVAL_SECONDS: ${FA_IMPORT_INTERVAL_SECONDS:-86400}
      FA_REQUEST_TIMEOUT_SECONDS: ${FA_REQUEST_TIMEOUT_SECONDS:-20}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?Set OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?Set OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_PRIVATE_BUCKET: ${OBJECT_STORAGE_PRIVATE_BUCKET:?Set OBJECT_STORAGE_PRIVATE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:?Set OBJECT_STORAGE_PUBLIC_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      RESEND_AUDIENCE_ID: ${RESEND_AUDIENCE_ID:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

  fixture-importer:
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-final_third}
      POSTGRES_USER: ${POSTGRES_USER:-final_third}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      FA_IMPORT_ENABLED: ${FA_IMPORT_ENABLED:-true}
      FA_IMPORT_INTERVAL_SECONDS: ${FA_IMPORT_INTERVAL_SECONDS:-86400}
      FA_IMPORT_QUEUE_INTERVAL_SECONDS: ${FA_IMPORT_QUEUE_INTERVAL_SECONDS:-15}
      FA_REQUEST_TIMEOUT_SECONDS: ${FA_REQUEST_TIMEOUT_SECONDS:-20}
